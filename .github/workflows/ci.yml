name: SandyChainHub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - "scripts/**"
      - "test/**"
      - "hardhat.config.*"
      - "package.json"
      - "package-lock.json"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
