name: InterLink Community Hub Build

on:
  push:
    branches:
      - main
      - feature/interlink-community-hub-phase1
    paths:
      - "community-hub/**"
      - ".github/workflows/community-hub-build.yml"
  pull_request:
    paths:
      - "community-hub/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: community-hub
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: community-hub/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
