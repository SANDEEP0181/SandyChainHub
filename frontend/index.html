<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SandyChainHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>SandyChainHub</h1>
    <p>SYSFI Testnet Community Hub</p>

    <button id="connectButton" onclick="connect()">Connect Wallet</button>
    <p id="walletStatus">Wallet not connected</p>

    <section class="info-card">
      <h2>Network & Contract</h2>
      <p><strong>Network:</strong> SYSFI Testnet</p>
      <p><strong>Chain ID:</strong> 76081</p>
      <p><strong>Contract Address:</strong><br>
        <a id="contractAddress" href="#" target="_blank" rel="noopener">Loading...</a>
      </p>
      <p><strong>Founder Wallet:</strong><br>
        <strong id="founderAddress">Deployment के बाद दिखेगा</strong>
      </p>
    </section>

    <section id="appContent">
      <!-- Existing app content -->
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.15.0/dist/ethers.umd.min.js"></script>
  <script src="config.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
